services:

  # ==========================================
  # MESSAGE BROKER - RABBITMQ
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: papiers-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: papiers
      RABBITMQ_DEFAULT_PASS: papiers123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # SERVICE DISCOVERY - CONSUL
  # ==========================================
  consul:
    image: hashicorp/consul:1.21
    container_name: papiers-consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    restart: unless-stopped

  # ==========================================
  # MYSQL - IDENTITY
  # ==========================================
  mysql-identity:
    image: mysql:8.0
    container_name: papiers-mysql-identity
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: papiers_identity
      MYSQL_USER: papiers
      MYSQL_PASSWORD: papiers123
    ports:
      - "3307:3306"
    volumes:
      - mysql_identity_data:/var/lib/mysql
    restart: unless-stopped

  # ==========================================
  # MYSQL - CATALOG
  # ==========================================
  mysql-catalog:
    image: mysql:8.4
    container_name: papiers-mysql-catalog
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: papiers_catalog
      MYSQL_USER: catalog
      MYSQL_PASSWORD: catalog_pw
    ports:
      - "3308:3306"
    volumes:
      - mysql_catalog_data:/var/lib/mysql
    restart: unless-stopped

  # ==========================================
  # MYSQL - INVENTORY
  # ==========================================
  mysql-inventory:
    image: mysql:8.4
    container_name: papiers-mysql-inventory
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: papiers_inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventory_pw
    ports:
      - "3309:3306"
    volumes:
      - mysql_inventory_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ==========================================
  # MYSQL - PURCHASE
  # ==========================================
  mysql-purchase:
    image: mysql:8.4
    container_name: papiers-mysql-purchase
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: papiers_purchase
      MYSQL_USER: purchase
      MYSQL_PASSWORD: purchase_pw
    ports:
      - "3310:3306"
    volumes:
      - mysql_purchase_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ==========================================
  # MYSQL - NOTIFICATIONS
  # ==========================================
  mysql-notifications:
    image: mysql:8.4
    container_name: papiers-mysql-notifications
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: papiers_notifications
      MYSQL_USER: notifications
      MYSQL_PASSWORD: notifications_pw
    ports:
      - "3311:3306"
    volumes:
      - mysql_notifications_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ==========================================
  # MYSQL - AUDITORIA
  # ==========================================
  mysql-auditoria:
    image: mysql:8.4
    container_name: papiers-mysql-auditoria
    environment:
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - mysql_auditoria_data:/var/lib/mysql
      - ./services/ms-auditoria/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ==========================================
  # MYSQL - REPORTES
  # ==========================================
  mysql-reportes:
    image: mysql:8.4
    container_name: papiers-mysql-reportes
    environment:
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - mysql_reportes_data:/var/lib/mysql
      - ./services/ms-reportes/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ==========================================
  # MICROSERVICE - IDENTITY
  # ==========================================
  identity:
    build:
      context: ./services/ms-identity
      dockerfile: Dockerfile
    container_name: papiers-identity
    volumes:
      - ./services/ms-identity:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql-identity
      DB_PORT: "3306"
      DB_DATABASE: papiers_identity
      DB_USERNAME: papiers
      DB_PASSWORD: papiers123
    depends_on:
      mysql-identity:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # MICROSERVICE - CATALOG
  # ==========================================
  catalog:
    build:
      context: ./services/ms-catalog
      dockerfile: Dockerfile
    container_name: papiers-catalog
    volumes:
      - ./services/ms-catalog:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql-catalog
      DB_PORT: "3306"
      DB_DATABASE: papiers_catalog
      DB_USERNAME: catalog
      DB_PASSWORD: catalog_pw

      # Eventos asíncronos -> ms-reportes
      SERVICE_NAME: ms-catalog
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
      RABBITMQ_USER: papiers
      RABBITMQ_PASSWORD: papiers123
      RABBITMQ_EXCHANGE: papiers.eventos
    depends_on:
      - mysql-catalog
      - rabbitmq
    restart: unless-stopped

  # ==========================================
  # MICROSERVICE - INVENTORY
  # ==========================================
  inventory:
    build:
      context: ./services/ms-inventory
      dockerfile: Dockerfile
    container_name: papiers-inventory
    volumes:
      - ./services/ms-inventory:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql-inventory
      DB_PORT: "3306"
      DB_DATABASE: papiers_inventory
      DB_USERNAME: inventory
      DB_PASSWORD: inventory_pw
      CATALOG_URL: http://catalog:8000

      # Eventos asíncronos -> ms-auditoria / ms-reportes
      SERVICE_NAME: ms-inventory
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
      RABBITMQ_USER: papiers
      RABBITMQ_PASSWORD: papiers123
      RABBITMQ_EXCHANGE: papiers.eventos
    depends_on:
      mysql-inventory:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # MICROSERVICE - PURCHASE
  # ==========================================
  purchase:
    build:
      context: ./services/ms-purchase
      dockerfile: Dockerfile
    container_name: papiers-purchase
    volumes:
      - ./services/ms-purchase:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql-purchase
      DB_PORT: "3306"
      DB_DATABASE: papiers_purchase
      DB_USERNAME: purchase
      DB_PASSWORD: purchase_pw

      CATALOG_URL: http://catalog:8000
      INVENTORY_URL: http://inventory:8000
      NOTIFICATIONS_URL: http://notifications:8000
      VALIDATE_PRODUCTS: "true"

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: papiers
      RABBITMQ_PASSWORD: papiers123
    depends_on:
      mysql-purchase:
        condition: service_healthy
      catalog:
        condition: service_started
      inventory:
        condition: service_started
      notifications:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # MICROSERVICE - NOTIFICATIONS
  # ==========================================
  notifications:
    build:
      context: ./services/ms-notifications
      dockerfile: Dockerfile
    container_name: papiers-notifications
    volumes:
      - ./services/ms-notifications:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql-notifications
      DB_PORT: "3306"
      DB_DATABASE: papiers_notifications
      DB_USERNAME: notifications
      DB_PASSWORD: notifications_pw

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: papiers
      RABBITMQ_PASSWORD: papiers123

      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
    depends_on:
      mysql-notifications:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # MICROSERVICE - AUDITORIA - FLASK
  # ==========================================
  ms-auditoria:
    build:
      context: ./services/ms-auditoria
      dockerfile: Dockerfile
    container_name: papiers-ms-auditoria
    environment:
      SERVICE_NAME: ms-auditoria
      SERVICE_PORT: "8005"
      SERVICE_ADDRESS: ms-auditoria

      DB_HOST: mysql-auditoria
      DB_PORT: "3306"
      DB_NAME: db_auditoria
      DB_USER: auditoria
      DB_PASSWORD: auditoria_pass

      RABBITMQ_URL: amqp://papiers:papiers123@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: papiers.eventos
      RABBITMQ_QUEUE: ms-auditoria.eventos
      RABBITMQ_ROUTING_KEYS: inventario.movimiento.registrado,compras.mercancia.recibida,compras.devolucion.registrada

      CONSUL_URL: http://consul:8500
      CONSUL_REGISTER: "false"

      APP_TZ: America/Bogota
      AUTO_CREATE_TABLES: "false"
    depends_on:
      mysql-auditoria:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # WORKER - AUDITORIA
  # ==========================================
  ms-auditoria-worker:
    build:
      context: ./services/ms-auditoria
      dockerfile: Dockerfile
    container_name: papiers-ms-auditoria-worker
    command: ["python", "-m", "app.consumer"]
    environment:
      SERVICE_NAME: ms-auditoria-worker
      SERVICE_PORT: "8005"

      DB_HOST: mysql-auditoria
      DB_PORT: "3306"
      DB_NAME: db_auditoria
      DB_USER: auditoria
      DB_PASSWORD: auditoria_pass

      RABBITMQ_URL: amqp://papiers:papiers123@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: papiers.eventos
      RABBITMQ_QUEUE: ms-auditoria.eventos
      RABBITMQ_ROUTING_KEYS: inventario.movimiento.registrado,compras.mercancia.recibida,compras.devolucion.registrada

      CONSUL_URL: http://consul:8500
      CONSUL_REGISTER: "false"
      APP_TZ: America/Bogota
      AUTO_CREATE_TABLES: "false"
    depends_on:
      mysql-auditoria:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # MICROSERVICE - REPORTES - FLASK
  # ==========================================
  ms-reportes:
    build:
      context: ./services/ms-reportes
      dockerfile: Dockerfile
    container_name: papiers-ms-reportes
    environment:
      SERVICE_NAME: ms-reportes
      SERVICE_PORT: "8007"
      SERVICE_ADDRESS: ms-reportes

      DB_HOST: mysql-reportes
      DB_PORT: "3306"
      DB_NAME: db_reportes
      DB_USER: reportes
      DB_PASSWORD: reportes_pass

      RABBITMQ_URL: amqp://papiers:papiers123@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: papiers.eventos
      RABBITMQ_QUEUE: ms-reportes.eventos
      RABBITMQ_ROUTING_KEYS: catalogo.producto.actualizado,inventario.movimiento.registrado,inventario.estado_stock.cambiado

      CONSUL_URL: http://consul:8500
      CONSUL_REGISTER: "false"

      APP_TZ: America/Bogota
      AUTO_CREATE_TABLES: "false"
    depends_on:
      mysql-reportes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # WORKER - REPORTES
  # ==========================================
  ms-reportes-worker:
    build:
      context: ./services/ms-reportes
      dockerfile: Dockerfile
    container_name: papiers-ms-reportes-worker
    command: ["python", "-m", "app.consumer"]
    environment:
      SERVICE_NAME: ms-reportes-worker
      SERVICE_PORT: "8007"

      DB_HOST: mysql-reportes
      DB_PORT: "3306"
      DB_NAME: db_reportes
      DB_USER: reportes
      DB_PASSWORD: reportes_pass

      RABBITMQ_URL: amqp://papiers:papiers123@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: papiers.eventos
      RABBITMQ_QUEUE: ms-reportes.eventos
      RABBITMQ_ROUTING_KEYS: catalogo.producto.actualizado,inventario.movimiento.registrado,inventario.estado_stock.cambiado

      CONSUL_URL: http://consul:8500
      CONSUL_REGISTER: "false"

      APP_TZ: America/Bogota
      AUTO_CREATE_TABLES: "false"
    depends_on:
      mysql-reportes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # API GATEWAY - UNICO PUERTO DE APLICACION
  # ==========================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: papiers-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./gateway:/var/www
    environment:
      IDENTITY_URL: http://identity:8000
      CATALOG_URL: http://catalog:8000
      INVENTORY_URL: http://inventory:8000
      PURCHASE_URL: http://purchase:8000
      NOTIFICATIONS_URL: http://notifications:8000

      AUDIT_URL: http://ms-auditoria:8005
      REPORTS_URL: http://ms-reportes:8007
    depends_on:
      - identity
      - catalog
      - inventory
      - purchase
      - notifications
      - ms-auditoria
      - ms-reportes
    restart: unless-stopped

# ==========================================
# PERSISTENT VOLUMES
# ==========================================
volumes:
  rabbitmq_data:
  mysql_identity_data:
  mysql_catalog_data:
  mysql_inventory_data:
  mysql_purchase_data:
  mysql_notifications_data:
  mysql_auditoria_data:
  mysql_reportes_data:
